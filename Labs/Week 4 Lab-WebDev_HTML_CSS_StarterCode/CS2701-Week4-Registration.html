<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Food for the homeless
        </title>
        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>
    <body>
        <header></header>
        <nav>
            <!-- ToDo: An unordered list to represent the menu, 
                       each list item should correspond to the menu items (Home, Register, Login, Help)
                       The css class of the menu is "navlist"
                       Check lecture slides about lists, an example of a more basic menu, and CSS class selector-->
            <ul class="navlist">
            </ul>
         </nav>
        <main>
            <!-- Check Week 4 Lecture to learn about HTML5 semantic elements-->
            <aside>
            </aside>
            <section>
                <form class="center" novalidate>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name"><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email"><br>

                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password"><br>

                    <label for="passwordConfirmation">Re-type password:</label><br>
                    <input type="password" id="passwordConfirmation" name="passwordConfirmation"><br>

                    <input type="checkbox">
                    <label for="alottmentBuy">I want to buy produce directly from the allotment owners</label><br>

                    <input type="checkbox">
                    <label for="alottmentSell">I want to sell produce from my allotment</label><br>

                    <br>

                    <input type="checkbox">
                    <label for="agree">I agree to the <a href="https://en.wikipedia.org/wiki/Terms_of_service">Terms of Use</a> and <a href="https://en.wikipedia.org/wiki/Privacy_policy">Privacy Policy</a></label><br>

                    <input type="submit">
                    <label for="learnMore"><a href="https://en.wikipedia.org/wiki/Main_Page">Learn more</a></label>
                </form>
                <div class="center" id="hiddenSection">
                    <p id="hiddenParagraph"></p>
                </div>
            </section>
        </main>
    </body>
</html>
