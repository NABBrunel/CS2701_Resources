
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Fresh Food For All</title>

        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>

    <body>
        <header>
            <h1>Fresh Food For All</h1>
        </header>

        <nav>
            <ul class="navlist">
                <li><a href="#">Home</a></li>
                <li><a href="#">Register</a></li>
                <li><a href="#">Login</a></li>
                <li><a href="#">Help</a></li>
            </ul>
        </nav>

        <main>
            <aside>
            </aside>

            <section>
                <form class="center">

                    <!-- Name -->
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <br><br>

                    <!-- Email -->
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <!-- Password -->
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password"
                           minlength="8" required>
                    <br><br>

                    <!-- Terms of Service -->
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms of Service.</label>
                    <br><br>

                    <!-- Buyer checkbox -->
                    <input type="checkbox" id="buyer" name="buyer" value="buyer">
                    <label for="buyer">
                        I want to buy produce directly from allotment owners.
                    </label>
                    <br>

                    <!-- Seller checkbox -->
                    <input type="checkbox" id="seller" name="seller" value="seller">
                    <label for="seller">
                        I want to sell produce from my allotment.
                    </label>
                    <br><br>

                    <!-- Register button -->
                    <button type="submit">Register</button>
                    <br><br>

                    <!-- Learn more link -->
                    <a href="#">Learn more</a>

                </form>

                <div class="center" id="hiddenSection">
                    <p id="hiddenParagraph"></p>
                </div>
            </section>
        </main>
    </body>
</html>
